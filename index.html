<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafbfe">
  <meta name="description" content="小洛后期提示词合集：一键精修、万能提示词公式、场照合成流程与使用示例。查找、阅读、一键复制。">
  <title>小洛后期提示词合集</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="小洛后期提示词合集，返回首页">
        <span class="brand-mark" aria-hidden="true">L<span>·</span></span>
        <span class="brand-type"><strong>小洛后期提示词合集</strong><small>XIAOLUO / PROMPT COLLECTION</small></span>
      </a>
      <form id="searchForm" class="search-box" role="search">
        <label class="sr-only" for="search">搜索全部提示词</label>
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="搜索任务、关键词或提示词" autocomplete="off" enterkeyhint="search">
        <button id="clearSearch" class="clear-search" type="button" aria-label="清空搜索" hidden>×</button>
        <kbd>/</kbd>
      </form>
    </div>
    <nav id="navigation" class="navigation" aria-label="主要分类"></nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer"><span>小洛后期提示词合集</span><span>提示词 · 流程 · 案例</span></footer>
  <dialog id="promptDialog" aria-labelledby="dialogTitle">
    <div class="dialog-head"><div><p id="dialogLabel" class="eyebrow"></p><h2 id="dialogTitle"></h2></div><button class="icon-button close-button" id="closeDialog" type="button" aria-label="关闭详情">×</button></div>
    <div id="dialogBody" class="dialog-body"></div>
    <div class="dialog-footer"><span id="dialogHint"></span><button class="button primary" id="dialogCopy" type="button"></button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="no-script">请启用浏览器的 JavaScript，以浏览和复制提示词。</p></noscript>
</body>
</html>
